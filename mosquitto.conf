# Broker for the robot, on the laptop's Windows hotspot address.
# Start it with:  & "C:\Program Files\mosquitto\mosquitto.exe" -c mosquitto.conf -v
#
# Mosquitto's Windows service only listens on localhost, which the Pico
# cannot reach. This listener is on the hotspot address instead, so both can
# run at the same time. Change the address if MQTT_BROKER_IP changes.
listener 1883 192.168.137.1
allow_anonymous true
