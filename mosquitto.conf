# Broker for the robot, on the laptop's IPv4 network interfaces.
# Start it with:  & "C:\Program Files (x86)\Mosquitto\mosquitto.exe" -c mosquitto.conf -v
#
# Listen even when the Windows hotspot is off or has a different address.
# Use the hotspot address for both the dashboard's --host and the Pico's
# MQTT_BROKER_IP. On Windows a separate broker service can own 127.0.0.1.
# Stop any other broker using port 1883 before starting this one.
listener 1883 0.0.0.0
allow_anonymous true
